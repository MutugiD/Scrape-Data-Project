name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      - name: Install deps
        run: pip install .
      - name: Lint
        run: flake8 sdk tests
      - name: Type check
        run: mypy sdk
      - name: Test
        run: pytest --maxfail=1 --disable-warnings -q
